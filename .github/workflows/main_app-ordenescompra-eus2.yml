# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-ordenescompra-eus2

on:
  push:
    branches:
      - main
  # En un pull request corre build + pruebas, pero NO despliega (ver la guarda del
  # job `deploy`). Sin esto, un PR no se verificaba nunca: el error aparecía recién
  # al mergear, con main ya roto.
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js version
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: npm install
        run: npm ci

      # Las pruebas corren ANTES del build: si una regla de negocio se rompió
      # (cantidades, montos, la sesión firmada), el deploy se detiene acá en vez de
      # llegar a producción. `npm test` usa el runner de Node con --experimental-
      # strip-types, que en Node 22 hace falta para los .ts.
      - name: npm test
        run: npm test

      - name: npm build
        run: npm run build

      - name: Assemble standalone deploy package
        run: |
          mkdir deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: deploy
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # SOLO se despliega desde main. Esta guarda es la que hace seguro el trigger de
    # pull_request de arriba: sin ella, abrir un PR mandaría su código a producción.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Los despliegues hacen fila. App Service acepta UNO a la vez: si llega otro
    # mientras hay uno en curso, OneDeploy responde `Conflict (CODE: 409)` y el job
    # muere aunque el build haya pasado limpio. Pasó dos veces el 23 de setiembre de
    # 2026, con dos personas empujando a main casi al mismo tiempo, y diagnosticarlo
    # cuesta porque el error no dice "esperá tu turno".
    #
    # `cancel-in-progress: false` es deliberado: cancelar el despliegue que ya está
    # a medio subir es justo lo que NO se quiere — dejaría la app a medias. El que
    # llega espera; el que está, termina.
    #
    # La fila es solo para DESPLEGAR: los `build` siguen corriendo en paralelo.
    concurrency:
      group: deploy-app-ordenescompra-eus2
      cancel-in-progress: false
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9CBF7E21B2E349FE96CC56DAE0B900E9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_77870F53DB0746E7A7369EBC0E30BBC5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_214CCEC81CD1414292FB6E044473D657 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-ordenescompra-eus2'
          slot-name: 'Production'
          package: .
          
